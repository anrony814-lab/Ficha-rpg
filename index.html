<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reino de Elementos</title>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #202024;
            --primary: #8257e5;
            --text: #e1e1e6;
            --accent: #04d361;
            --danger: #f75a68;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); padding-bottom: 60px; }

        /* HEADER & MENU */
        header { background: var(--card-bg); padding: 1rem; text-align: center; border-bottom: 2px solid var(--primary); }
        h1 { color: var(--primary); font-size: 1.8rem; }
        
        .nav-hub { display: flex; justify-content: center; gap: 10px; padding: 15px; background: #18181b; }
        .btn-nav { background: var(--card-bg); border: 1px solid var(--primary); color: white; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-nav:hover { background: var(--primary); }

        /* SEÇÕES */
        .section-view { display: none; padding: 20px; max-width: 900px; margin: 0 auto; }
        .section-view.active { display: block; }

        /* CARDS & GRIDS */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-top: 15px; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid #323238; }

        /* FORMULÁRIOS & BOTOES */
        input, textarea, select { width: 100%; padding: 10px; margin: 8px 0; background: #121214; border: 1px solid #323238; color: white; border-radius: 4px; }
        button { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { opacity: 0.9; }

        /* EBOOK */
        .ebook-reader { background: var(--card-bg); padding: 20px; border-radius: 8px; min-height: 200px; margin-top: 10px; }
        .ebook-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }

        /* MODAL CONFIGS */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: var(--card-bg); padding: 20px; border-radius: 8px; width: 90%; max-width: 500px; }
        
        /* MENU RODAPÉ */
        .footer-menu { position: fixed; bottom: 0; width: 100%; background: #18181b; padding: 10px; text-align: right; }
        .btn-gear { width: auto; background: transparent; font-size: 1.2rem; }
    </style>
</head>
<body>

    <header>
        <h1>🏰 Reino de Elementos</h1>
    </header>

    <!-- NAVEGAÇÃO HUB -->
    <div class="nav-hub">
        <button class="btn-nav" onclick="switchView('mestre')">👑 MESTRE</button>
        <button class="btn-nav" onclick="switchView('regras')">📖 REGRAS</button>
        <button class="btn-nav" onclick="switchView('jogador')">⚔️ JOGADOR</button>
    </div>

    <!-- 👑 SEÇÃO DO MESTRE -->
    <div id="sec-mestre" class="section-view active">
        <h2>Escudo e Painel do Mestre</h2>
        <div class="grid">
            <div class="card">
                <h3>Status da Equipe (HP/Nível)</h3>
                <div id="mestre-party-status">Nenhuma ficha sincronizada.</div>
            </div>
            <div class="card">
                <h3>Criador de Monstros / PNJ</h3>
                <input type="text" id="mob-nome" placeholder="Nome do Monstro/PNJ">
                <input type="number" id="mob-hp" placeholder="HP Máximo">
                <textarea id="mob-notas" placeholder="Ataques e notas rápidas"></textarea>
                <button onclick="criarMonstro()">Adicionar ao Combate</button>
            </div>
        </div>
        <div id="lista-monstros" class="grid"></div>
    </div>

    <!-- 📖 SEÇÃO DE REGRAS (E-BOOK) -->
    <div id="sec-regras" class="section-view">
        <h2>E-book de Regras Integrado</h2>
        <div class="card">
            <button onclick="toggleIndice()" style="width: auto; margin-bottom: 10px;">📚 Índice Rápido</button>
            <div id="indice-capitulos" style="display:none; margin-bottom: 15px;"></div>
            
            <div class="ebook-reader" id="ebook-conteudo">
                <!-- O conteúdo do capítulo vai aqui -->
            </div>
            <div class="ebook-controls">
                <button onclick="mudarPagina(-1)" style="width: auto;">⬅️ Anterior</button>
                <span id="ebook-pagina-num">Página 1</span>
                <button onclick="mudarPagina(1)" style="width: auto;">Próxima ➡️</button>
            </div>
        </div>
    </div>

    <!-- ⚔️ SEÇÃO DO JOGADOR -->
    <div id="sec-jogador" class="section-view">
        <h2>Gestor de Fichas</h2>
        <button onclick="novaFicha()" style="margin-bottom: 15px;">➕ Criar Nova Ficha</button>
        
        <!-- IA / Leitor de Habilidades -->
        <div class="card" style="margin-bottom: 20px;">
            <h3>🧠 IA / Leitor Inteligente de Habilidades</h3>
            <textarea id="ia-prompt" placeholder="Cole aqui o texto desorganizado da habilidade..."></textarea>
            <button onclick="processarComIA()">Analisar com Gemini IA</button>
            <div id="ia-resultado" style="margin-top: 10px;"></div>
        </div>

        <h3>Sua Lista de Personagens</h3>
        <div id="grid-fichas" class="grid"></div>
    </div>

    <!-- MENU RODAPÉ (CONFIGURAÇÕES DE INTEGRAÇÃO) -->
    <div class="footer-menu">
        <button class="btn-gear" onclick="abrirConfig()">⚙️ ☰ Configurações / Nuvem</button>
    </div>

    <!-- MODAL DE CONFIGURAÇÕES (GEMINI & SUPABASE) -->
    <div id="modal-config" class="modal">
        <div class="modal-content">
            <h3>Integrar Nuvem e IA</h3>
            <label>Chave API do Google Gemini:</label>
            <input type="password" id="cfg-gemini-key">
            
            <label>Supabase URL:</label>
            <input type="text" id="cfg-supabase-url">
            
            <label>Supabase Anon Key:</label>
            <input type="password" id="cfg-supabase-key">
            
            <button onclick="salvarConfig()" style="background: var(--accent); margin-top: 10px;">Salvar Configurações</button>
            <button onclick="fecharConfig()" style="background: var(--danger); margin-top: 5px;">Fechar</button>
        </div>
    </div>

    <script>
        // --- NAVEGAÇÃO ENTRE ABAS ---
        function switchView(viewName) {
            document.querySelectorAll('.section-view').forEach(el => el.classList.remove('active'));
            document.getElementById(`sec-${viewName}`).classList.add('active');
        }

        // --- SISTEMA DO E-BOOK DE REGRAS ---
        const ebookCapitulos = [
            { titulo: "Capítulo 1: Introdução", texto: "Bem-vindo ao Reino de Elementos! Este e-book contém todas as regras integradas para sua mesa." },
            { titulo: "Capítulo 2: Combate e Ações", texto: "Durante o combate, a iniciativa define a ordem dos turnos. Cada jogador pode realizar uma Ação e um Movimento." },
            { titulo: "Capítulo 3: Magias e Elementos", texto: "Os elementos se dividem em Fogo, Água, Terra, Ar e Mágico. Combinar elementos gera efeitos necróticos e elementais." }
        ];
        let capituloAtual = 0;

        function renderEbook() {
            document.getElementById('ebook-conteudo').innerHTML = `<h3>${ebookCapitulos[capituloAtual].titulo}</h3><p style="margin-top: 10px;">${ebookCapitulos[capituloAtual].texto}</p>`;
            document.getElementById('ebook-pagina-num').innerText = `Página ${capituloAtual + 1} de ${ebookCapitulos.length}`;
        }
        function mudarPagina(dir) {
            if (capituloAtual + dir >= 0 && capituloAtual + dir < ebookCapitulos.length) {
                capituloAtual += dir;
                renderEbook();
            }
        }
        function toggleIndice() {
            const ind = document.getElementById('indice-capitulos');
            if (ind.style.display === 'none') {
                ind.innerHTML = ebookCapitulos.map((c, i) => `<div style="cursor:pointer; padding: 5px 0;" onclick="irParaCap(${i})">📌 ${c.titulo}</div>`).join('');
                ind.style.display = 'block';
            } else {
                ind.style.display = 'none';
            }
        }
        function irParaCap(index) {
            capituloAtual = index;
            renderEbook();
            toggleIndice();
        }
        renderEbook();

        // --- PAINEL DO MESTRE ---
        let monstros = [];
        function criarMonstro() {
            const nome = document.getElementById('mob-nome').value;
            const hp = document.getElementById('mob-hp').value;
            const notas = document.getElementById('mob-notas').value;

            if(!nome || !hp) return alert("Preencha pelo menos Nome e HP!");

            monstros.push({ nome, hpAtual: hp, hpMax: hp, notas });
            renderMonstros();
            document.getElementById('mob-nome').value = '';
            document.getElementById('mob-hp').value = '';
            document.getElementById('mob-notas').value = '';
        }
        function renderMonstros() {
            const container = document.getElementById('lista-monstros');
            container.innerHTML = monstros.map((m, i) => `
                <div class="card">
                    <h4>👾 ${m.nome}</h4>
                    <p>HP: ${m.hpAtual} / ${m.hpMax}</p>
                    <p><small>${m.notas}</small></p>
                    <button onclick="alterarHP(${i}, -1)" style="width: auto; background: var(--danger);">-</button>
                    <button onclick="alterarHP(${i}, 1)" style="width: auto; background: var(--accent);">+</button>
                </div>
            `).join('');
        }
        function alterarHP(index, valor) {
            monstros[index].hpAtual = parseInt(monstros[index].hpAtual) + valor;
            renderMonstros();
        }

        // --- CONFIGURAÇÕES & CHAVES ---
        function abrirConfig() { document.getElementById('modal-config').style.display = 'flex'; }
        function fecharConfig() { document.getElementById('modal-config').style.display = 'none'; }
        function salvarConfig() {
            localStorage.setItem('cfg_gemini', document.getElementById('cfg-gemini-key').value);
            localStorage.setItem('cfg_sp_url', document.getElementById('cfg-supabase-url').value);
            localStorage.setItem('cfg_sp_key', document.getElementById('cfg-supabase-key').value);
            alert('Configurações salvas localmente!');
            fecharConfig();
        }

        // --- IA / GEMINI INTEGRADO ---
        async function processarComIA() {
            const key = localStorage.getItem('cfg_gemini');
            const prompt = document.getElementById('ia-prompt').value;
            
            if(!key) return alert("Configure sua Chave API do Gemini no menu ☰ do rodapé primeiro!");
            if(!prompt) return alert("Escreva ou cole algum texto!");

            document.getElementById('ia-resultado').innerText = "Analisando com a IA...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: `Analise a seguinte habilidade de RPG e formate organizadamente separando em Nome, Requisito, Limitação e Efeito:\n\n${prompt}` }]
                        }]
                    })
                });
                const data = await response.json();
                const textoGerado = data.candidates[0].content.parts[0].text;
                document.getElementById('ia-resultado').innerHTML = `<div class="card" style="background:#18181b;">${textoGerado.replace(/\n/g, '<br>')}</div>`;
            } catch (err) {
                document.getElementById('ia-resultado').innerText = "Erro ao processar com a IA. Verifique sua chave API.";
            }
        }
    </script>
</body>
          </html>
