<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema ROL - Ficha & Painel do Mestre</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navegação Principal -->
  <nav class="nav-bar">
    <button onclick="mudarAba('ficha')">Ficha do Jogador</button>
    <button onclick="mudarAba('mestre')">Painel do Mestre (Obsidian)</button>
  </nav>

  <!-- ABA: FICHA DO JOGADOR -->
  <main id="aba-ficha" class="aba-conteudo ativa">
    <div class="card-personagem">
      <!-- Upload de Foto -->
      <div class="foto-container">
        <img id="preview-foto" src="https://via.placeholder.com/150" alt="Foto do Personagem">
        <input type="file" id="input-foto" accept="image/*" onchange="carregarFoto(event)">
      </div>

      <h2>Ficha de Personagem</h2>

      <!-- Vitalidade -->
      <div class="status-vitalidade">
        <label>Vitalidade (PV):</label>
        <input type="number" id="pv-atual" value="10" min="0"> / 
        <input type="number" id="pv-max" value="10" min="1">
      </div>

      <!-- Habilidades -->
      <div class="secao-habilidades">
        <h3>Habilidades</h3>
        <div class="add-habilidade">
          <input type="text" id="nome-habilidade" placeholder="Nome da habilidade">
          <button onclick="adicionarHabilidade()">Adicionar</button>
        </div>
        <ul id="lista-habilidades"></ul>
      </div>
    </div>
  </main>

  <!-- ABA: PAINEL DO MESTRE (OBSIDIAN) -->
  <main id="aba-mestre" class="aba-conteudo">
    <div class="painel-obsidian">
      <h2>Painel do Mestre</h2>
      
      <!-- Criar Sala -->
      <div class="modulo-sala">
        <h3>Sessão de Jogo</h3>
        <input type="text" id="nome-sala" placeholder="Nome da Sala">
        <button onclick="criarSala()">Criar Sala</button>
        <p id="status-sala"></p>
      </div>

      <!-- Caderno de Notas Obsidian -->
      <div class="modulo-notas">
        <h3>Notas do Mestre</h3>
        <textarea id="nota-obsidian" placeholder="Escreva suas anotações da campanha aqui..."></textarea>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
